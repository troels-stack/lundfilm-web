name: Build and deploy to One.com

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      list_only:
        description: "Only list the folders on the One.com server (no upload)"
        type: boolean
        default: false

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SFTP_HOST: ${{ secrets.SFTP_HOST }}
      SFTP_USER: ${{ secrets.SFTP_USER }}
      SFTP_PASSWORD: ${{ secrets.SFTP_PASSWORD }}
      SFTP_PATH: ${{ secrets.SFTP_PATH }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build
        run: node build.js

      - name: Install lftp
        if: env.SFTP_HOST != '' && env.SFTP_USER != '' && env.SFTP_PASSWORD != ''
        run: sudo apt-get update -qq && sudo apt-get install -y -qq lftp

      - name: List folders on the server
        if: inputs.list_only && env.SFTP_HOST != '' && env.SFTP_PASSWORD != ''
        run: |
          lftp -u "$SFTP_USER,$SFTP_PASSWORD" "sftp://$SFTP_HOST" -e "set sftp:auto-confirm yes; cls -la webroots/www/; quit" > listing.txt 2>&1 || true
          cat listing.txt
          # Also expose the listing as an annotation, readable through the API
          BODY=$(head -c 3500 listing.txt | sed ':a;N;$!ba;s/%/%25/g;s/\n/%0A/g')
          echo "::notice title=Server listing::${BODY}"

      - name: Upload to One.com (SFTP)
        if: ${{ !inputs.list_only }}
        run: |
          if [ -z "$SFTP_HOST" ] || [ -z "$SFTP_USER" ] || [ -z "$SFTP_PASSWORD" ]; then
            echo "::notice::SFTP secrets are not set — the site was built but not uploaded."
            exit 0
          fi
          TARGET="${SFTP_PATH:-webroots/www}"
          lftp -u "$SFTP_USER,$SFTP_PASSWORD" "sftp://$SFTP_HOST" -e "set sftp:auto-confirm yes; set net:max-retries 3; mirror -R --verbose --parallel=4 dist/ $TARGET; quit" > upload.txt 2>&1
          STATUS=$?
          cat upload.txt
          COUNT=$(grep -c "Transferring file" upload.txt || true)
          echo "::notice title=Upload::Uploaded ${COUNT} files to ${TARGET} (exit ${STATUS})"
          exit $STATUS
